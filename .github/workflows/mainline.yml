name: Build Mainline Linux Kernel for Exynos990-z3s

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential bc flex bison libssl-dev

      - name: Build kernel, dtbs, and modules
        run: |
          make ARCH=arm64 exynos990_defconfig
          make -j$(nproc) all

      - name: Install modules to modules/lib/
        run: |
          mkdir -p modules/lib/
          make modules_install INSTALL_MOD_PATH=modules
          # Move modules to modules/lib/ if needed
          if [ -d "modules/lib/modules" ]; then
            mv modules/lib/modules/* modules/lib/
            rm -rf modules/lib/modules
          fi

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp arch/arm64/boot/Image artifacts/
          cp arch/arm64/boot/dts/exynos/*.dtb artifacts/
          cp -r modules/lib/ artifacts/modules/

      - name: Upload kernel, dtbs, and modules
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: |
            artifacts/Image
            artifacts/*.dtb
            artifacts/modules/
