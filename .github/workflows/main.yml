name: Build Android Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev autoconf bison flex libssl-dev libelf-dev gcc-aarch64-linux-gnu

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make exynos990_defconfig
        make ARCH=arm64 -j$(nproc)

    - name: Install modules
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make modules
        make modules_install INSTALL_MOD_PATH=$GITHUB_WORKSPACE/modules

    - name: Prepare artifacts
      run: |
        mkdir -p artifacts
        cp arch/arm64/boot/Image artifacts/
        cp arch/arm64/boot/dts/exynos/*.dtb artifacts/ || true
        cp -r modules/lib/modules artifacts/modules || true

    - name: Upload kernel image, dtbs, and modules
      uses: actions/upload-artifact@v4
      with:
        name: kernel-artifacts
        path: |
          artifacts/Image
          artifacts/*.dtb
          artifacts/modules/
